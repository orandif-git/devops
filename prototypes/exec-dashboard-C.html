<!doctype html><html><head><meta charset="utf-8"><title>Executive Dashboard – Prototype C (storyline + roadmap)</title>
<style>
:root{--bg:#faf9f8;--card:#fff;--fg:#242424;--fg2:#6b6b6b;--line:#e6e4e1;--accent:#0f6cbd}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:13px "Segoe UI",system-ui,sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:18px 24px}
.head{display:flex;gap:14px;align-items:flex-start} .head h1{margin:0;font-size:20px} .live{color:var(--fg2);font-size:12px} .live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#1a9d57;margin-right:5px}

.story{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:14px 0} .story .hl{font-size:20px;font-weight:600;line-height:1.3} .story .hl b{padding:0 4px;border-radius:4px;cursor:pointer} .story .sub{color:var(--fg2);margin-top:4px}

.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap} .bar input{border:1px solid var(--line);border-radius:16px;padding:6px 14px;font:inherit;width:260px} .fchip{background:#deecf9;border-radius:12px;padding:2px 4px 2px 10px;display:inline-flex;gap:6px;align-items:center} .fchip button{border:0;background:none;cursor:pointer;color:var(--fg2)}

.gb u{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.22)} .slipx{position:absolute;top:13px;height:8px;border-radius:0 4px 4px 0;background:repeating-linear-gradient(45deg,#d13438 0 4px,#f1a5a7 4px 8px);opacity:.9}

table{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--line);border-radius:8px} th{text-align:left;color:var(--fg2);padding:8px;border-bottom:2px solid var(--line)} td{padding:7px 8px;border-bottom:1px solid var(--line)} tr.row{cursor:pointer} tr.row:hover td{background:#f3f9fd}
.sw{display:inline-flex;width:16px;height:16px;border-radius:4px;color:#fff;font-size:10px;font-weight:700;align-items:center;justify-content:center}
.drawer{position:fixed;right:0;top:0;bottom:0;width:380px;background:#fff;border-left:1px solid var(--line);box-shadow:-6px 0 24px rgba(0,0,0,.15);padding:18px;transform:translateX(100%);transition:transform .2s;z-index:20;overflow:auto} .drawer.open{transform:none}
.drawer h2{margin:0 0 4px;font-size:16px} .kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin:12px 0} .kv dt{color:var(--fg2)} .kv dd{margin:0}

</style></head><body><div class="wrap">
<div class="head"><div style="flex:1"><h1>Executive Dashboard</h1><div class="live"><i></i>Live · refreshed just now</div></div><input class="btn" id="q" placeholder="Ask or search…" style="width:260px;cursor:text;border-radius:16px"><button class="btn">⟳ Refresh</button></div>
<div class="story"><div class="hl" id="hl"></div><div class="sub" id="sub"></div><div class="rag" id="rag"></div></div>
<div class="tabs" id="tabs"></div><div class="bar" id="bar"></div><div id="view"></div></div>
<aside class="drawer" id="drawer"></aside><div class="tip" id="tip"></div>
<script>
/* shared sample data and helpers for the three Executive Dashboard prototypes (not part of the extension) */
const CATS=["Regulatory","Software upgrade","Customer experience","Infrastructure","Security","Data & Analytics"];
const TEAMS=["Platform","Payments","Risk & Credit","Mobile","Data","Security"];
const TITLES=["Basel IV reporting","AML transaction monitoring","GDPR data retention","FATCA/CRS update","PSD3 readiness","Sanctions screening upgrade","Regulatory capital reporting","ERP v12 upgrade","Core banking patch 9.4","CRM platform upgrade","Database 19c migration","Mobile SDK 5 upgrade","Middleware 8 upgrade","Windows 11 rollout","Digital onboarding","Loyalty app revamp","Self-service portal","Chatbot v2","Branch queue system","Cloud landing zone","Network refresh","DR failover test","Observability platform","Data centre exit","Zero trust rollout","PAM implementation","SOC automation","Vulnerability management","Data lake migration","Reporting warehouse","ML credit scoring","Open banking APIs","Card tokenisation","Treasury workstation","Customer 360"];

  const state=i%11===3?"Not Started":i%9===4?"Completed":i%13===6?"On Hold":i%2?"Doing":"Delivery Committed";

  slip=Math.max(0,slip); if(state==="Doing"&&rnd()<.4)slip=0;
  const status=state==="Completed"?"done":state==="Not Started"?"idle":(slip>30||state==="On Hold")?"red":slip>7?"amber":"green";
  const conf=state==="Completed"?100:state==="Not Started"?null:Math.max(3,Math.min(97,Math.round(100-slip*1.6-(state==="On Hold"?30:0))));
  const reasons={red:state==="On Hold"?"On hold; go-live at risk":`Forecast ${slip} days after go-live`,amber:`Could slip ${slip} days without action`,green:"Progress in line with time",done:"Delivered",idle:"Not started yet"}[status];
  return {id:1100+i*7,title:t,cat:CATS[CATOF[i]],team:TEAMS[Math.floor(rnd()*6)],state,status,pct,conf,goLive:iso(goLive),start:iso(start),forecast:iso(addDays(goLive,slip)),slip,hours:Math.round(200+rnd()*1800),reasons,
    q:"Q"+(Math.floor(goLive.getUTCMonth()/3)+1)+" "+String(goLive.getUTCFullYear()).slice(2)};
});
const ST={green:{name:"On track",c:"#1a9d57",i:"✓"},amber:{name:"Needs attention",c:"#f2a900",i:"▲"},red:{name:"At risk",c:"#d13438",i:"!"},idle:{name:"Not started",c:"#8a8886",i:"○"},done:{name:"Done",c:"#2b6cb0",i:"●"}};
const ORDER=["green","amber","red","idle","done"];
const QS=[...new Set(EP.map(e=>e.q))].sort((a,b)=>(a.slice(4)+a[1]).localeCompare(b.slice(4)+b[1]));
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const nice=d=>new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"});
const count=(arr,f)=>arr.filter(f).length;

const F={status:null,cat:null,text:""};let tab="Roadmap";
const pass=(e,skip)=>(skip==="status"||!F.status||e.status===F.status)&&(skip==="cat"||!F.cat||e.cat===F.cat)&&(!F.text||(e.title+" "+e.cat+" "+e.state+" "+e.id).toLowerCase().includes(F.text));
const set=(k,v)=>{F[k]=F[k]===v?null:v;draw();};const tip=$("#tip");const show=(ev,t)=>{tip.innerHTML=t;tip.style.display="block";tip.style.left=Math.min(ev.clientX+12,innerWidth-260)+"px";tip.style.top=ev.clientY+12+"px";};
function story(){const base=EP.filter(e=>pass(e)),n=base.length||1,red=count(base,e=>e.status==="red"),amb=count(base,e=>e.status==="amber"),grn=count(base,e=>e.status==="green"),done=count(base,e=>e.status==="done");
 const worst=CATS.map(c=>[c,count(base,e=>e.cat===c&&e.status==="red")]).sort((a,b)=>b[1]-a[1])[0];
 $("#hl").innerHTML=`<b style="background:#fde7e9;color:#a4262c" onclick="set('status','red')">${red} of ${base.length}</b> Epics are at risk${worst&&worst[1]?`, mostly <b style="background:#eee" onclick="set('cat','${worst[0]}')">${worst[0]}</b>`:""}.`;
 const nextQ=base.filter(e=>e.status!=="done"&&new Date(e.goLive)<new Date(+TODAY+90*DAY)).length;
 $("#sub").textContent=`${grn} on track · ${amb} need attention · ${done} delivered. ${nextQ} go-lives fall in the next 90 days.`;
 $("#rag").innerHTML="";ORDER.forEach(k=>{const v=count(EP.filter(e=>pass(e,"status")),e=>e.status===k);if(!v)return;$("#rag").append(h("div",{class:F.status&&F.status!==k?"dim":"",style:`flex:${v};background:${ST[k].c}`,title:ST[k].name,onclick:()=>set("status",k)},v+" "+ST[k].name));});}
function tabs(){const b=$("#tabs");b.innerHTML="";["Roadmap","Scorecards","Table"].forEach(t=>b.append(h("button",{class:"tab"+(tab===t?" on":""),onclick:()=>{tab=t;draw();}},t)));}
function bar(){const b=$("#bar");b.innerHTML="";[["status",v=>ST[v].name],["cat",v=>v]].forEach(([k,f])=>{if(F[k])b.append(h("span",{class:"fchip"},f(F[k]),h("button",{onclick:()=>set(k,F[k])},"✕")));});if(F.status||F.cat||F.text)b.append(h("button",{class:"btn",onclick:()=>{F.status=F.cat=null;F.text="";$("#q").value="";draw();}},"Clear filters"));}
const T0=new Date("2026-08-01T00:00:00Z"),T1=new Date("2027-08-01T00:00:00Z"),span=T1-T0,pos=d=>Math.max(0,Math.min(100,(new Date(d)-T0)/span*100));
function roadmap(){const v=$("#view");v.innerHTML="";const road=h("div",{class:"road"});const months=[];for(let d=new Date(T0);d<T1;d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1)))months.push(new Date(d));
 const head=h("div",{class:"rh"},h("div"),h("div",{class:"m",style:`grid-template-columns:repeat(${months.length},1fr)`},months.map(m=>h("span",{},m.toLocaleDateString("en-GB",{month:"short",timeZone:"UTC"})+(m.getUTCMonth()===0||m===months[0]?" "+String(m.getUTCFullYear()).slice(2):"")))));road.append(head);
 const trk=()=>h("div",{class:"tr",style:`background-size:${100/months.length}% 100%`});
 CATS.forEach(c=>{const items=EP.filter(e=>pass(e)&&e.cat===c).sort((a,b)=>a.goLive.localeCompare(b.goLive));if(!items.length)return;
  const cl=h("div",{class:"lane cat",onclick:()=>set("cat",c)},h("div",{class:"nm"},c,h("small",{},items.length+" Epics · "+count(items,e=>e.status==="red")+" at risk")),trk());road.append(cl);
  items.forEach(e=>{const tr=trk(),l=pos(e.start),r=pos(e.goLive),dim=F.status&&F.status!==e.status;
   const bar=h("div",{class:"gb"+(dim?" dim":""),style:`left:${l}%;width:${Math.max(.6,r-l)}%;background:${ST[e.status].c}`,onclick:()=>openDrawer(e),onmousemove:ev=>show(ev,`<b>${e.title}</b><br>${ST[e.status].name} · ${e.pct}% done<br>Go-live ${nice(e.goLive)}${e.slip?`<br>Forecast ${nice(e.forecast)} (+${e.slip}d)`:""}`),onmouseleave:()=>tip.style.display="none"},h("u",{style:`width:${e.pct}%`}),h("span",{style:"position:relative"},e.title));
   tr.append(bar);if(e.slip>0&&e.status!=="done")tr.append(h("div",{class:"slipx",style:`left:${r}%;width:${Math.max(.4,pos(e.forecast)-r)}%`,title:"Forecast slip"}));
   if(e.status!=="done"&&e.status!=="idle")tr.append(h("div",{class:"diam",style:`left:calc(${pos(e.forecast)}% - 7px);${dim?"opacity:.3":""}`,title:"Forecast finish"}));
   road.append(h("div",{class:"lane"},h("div",{class:"nm"},e.title,h("small",{},e.state)),tr));});});
 const tx=pos(TODAY);const ov=h("div",{style:"position:absolute;left:200px;right:0;top:0;bottom:0;pointer-events:none"},h("div",{class:"today",style:`left:${tx}%`},h("span",{},"Today")));road.append(ov);
 v.append(road,h("div",{style:"color:#6b6b6b;margin-top:8px"},"Bar = start → go-live, darker part = progress · hatched = forecast slip · ◆ = forecast finish"));}
function cards(){const v=$("#view");v.innerHTML="";const g=h("div",{class:"cards"});CATS.forEach(c=>{const items=EP.filter(e=>pass(e,"cat")&&e.cat===c);if(!items.length)return;const act=items.filter(e=>e.status!=="done"&&e.status!=="idle"),avg=act.length?Math.round(act.reduce((a,e)=>a+e.pct,0)/act.length):0;
 const conf=act.length?Math.round(act.reduce((a,e)=>a+(e.conf||0),0)/act.length):0;
 g.append(h("div",{class:"sc"+(F.cat===c?" on":""),onclick:()=>set("cat",c)},h("h3",{},c,h("span",{style:"color:#6b6b6b;font-weight:400"},items.length+" Epics")),h("div",{class:"big"},avg+"% ",h("span",{style:"font-size:13px;color:#6b6b6b;font-weight:400"},"average progress")),
  h("div",{class:"mix",html:ORDER.map(k=>{const n=count(items,e=>e.status===k);return n?`<div style="flex:${n};background:${ST[k].c}" title="${ST[k].name}: ${n}"></div>`:"";}).join("")}),
  h("div",{class:"row"},h("span",{},"Delivery confidence"),h("b",{style:"color:#242424"},conf+"%")),h("div",{class:"row"},h("span",{},"At risk / need attention"),h("b",{style:"color:#242424"},count(items,e=>e.status==="red")+" / "+count(items,e=>e.status==="amber"))),h("div",{class:"row"},h("span",{},"Next go-live"),h("b",{style:"color:#242424"},(items.filter(e=>e.status!=="done"&&new Date(e.goLive)>=TODAY).sort((a,b)=>a.goLive.localeCompare(b.goLive))[0]?.goLive?nice(items.filter(e=>e.status!=="done"&&new Date(e.goLive)>=TODAY).sort((a,b)=>a.goLive.localeCompare(b.goLive))[0].goLive):"–")))));});v.append(g);}
function tbl(){const v=$("#view");v.innerHTML="";const t=h("table",{},h("thead",{},h("tr",{},["Status","Epic","Type","State","Progress","Go-live","Forecast","Why"].map(x=>h("th",{},x)))));const b=h("tbody");EP.filter(e=>pass(e)).sort((a,b)=>b.slip-a.slip).forEach(e=>b.append(h("tr",{class:"row",onclick:()=>openDrawer(e)},h("td",{html:`<span class="sw" style="background:${ST[e.status].c}">${ST[e.status].i}</span> ${ST[e.status].name}`}),h("td",{},h("b",{},e.title)),h("td",{},e.cat),h("td",{},e.state),h("td",{},e.pct+"%"),h("td",{},nice(e.goLive)),h("td",{},nice(e.forecast)+(e.slip?" +"+e.slip+"d":"")),h("td",{style:"color:#6b6b6b"},e.reasons))));t.append(b);v.append(t);}
function openDrawer(e){const d=$("#drawer");d.innerHTML=`<button class="btn" style="float:right" onclick="this.parentNode.classList.remove('open')">✕ Close</button><h2>${e.title}</h2><div style="color:#6b6b6b">${e.id} · ${e.cat} · ${e.team}</div><p><span class="sw" style="background:${ST[e.status].c}">${ST[e.status].i}</span> <b>${ST[e.status].name}</b></p><p>${e.reasons}</p>
 <dl class="kv"><dt>State</dt><dd>${e.state}</dd><dt>Progress</dt><dd>${e.pct}%</dd><dt>Start</dt><dd>${nice(e.start)}</dd><dt>Go-live</dt><dd>${nice(e.goLive)}</dd><dt>Forecast</dt><dd>${nice(e.forecast)} ${e.slip?`(+${e.slip}d)`:""}</dd><dt>Confidence</dt><dd>${e.conf==null?"–":e.conf+"%"}</dd><dt>Hours booked</dt><dd>${e.hours.toLocaleString()} h</dd></dl><button class="btn pri">Open the Epic</button>`;d.classList.add("open");}
function draw(){story();tabs();bar();({Roadmap:roadmap,Scorecards:cards,Table:tbl})[tab]();}
$("#q").oninput=e=>{F.text=e.target.value.toLowerCase().trim();draw();};document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#drawer").classList.remove("open");});draw();
</script></body></html>
