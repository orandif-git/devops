function insights(){const b=base();const dn=b.filter(e=>e.doneAt),ot=dn.length?Math.round(100*cnt(dn,e=>e.doneAt<=e.goLive)/dn.length):0,late=dn.filter(e=>e.doneAt>e.goLive),avgL=late.length?Math.round(late.reduce((s,e)=>s+(new Date(e.doneAt)-new Date(e.goLive))/DAY,0)/late.length):0;
 return`<div class="fade"><div class="g"><div class="card s8">${byField(b)}</div><div class="card s4"><h3>Delivery performance <small>Epics that reached Done</small></h3><div class="donutrow" style="margin-bottom:14px"><div class="ring">${ring(ot,104,11,ot>=70?"#1fae5a":ot>=50?"#d97706":"#dc2626","#eee")}<b>${ot}%</b></div><div class="kv"><div><span>On time</span><b>${cnt(dn,e=>e.doneAt<=e.goLive)} of ${dn.length}</b></div><div><span>Avg days late</span><b>${avgL} d</b></div></div></div><div style="font-size:12.5px;color:var(--l2)">On time = delivered on or before its go-live date. Delivered date comes from the work item history.</div>${late.length?`<h3 style="margin:18px 0 6px;font-size:14px">Biggest delays</h3>${late.map(e=>({e,d:Math.round((new Date(e.doneAt)-new Date(e.goLive))/DAY)})).sort((x,y)=>y.d-x.d).slice(0,4).map(x=>`<div class="pr" data-ep="${x.e.id}" style="grid-template-columns:1fr auto"><span>${x.e.title}</span><span class="pill r">+${x.d} d</span></div>`).join("")}`:""}</div></div>

 $("#bViews").onclick=()=>toast("Saved views: your filters and layout, per person");$("#bFull").onclick=()=>toast("Full screen");$$("#src button").forEach(b=>b.onclick=()=>{S.src=b.dataset.s;$$("#src button").forEach(x=>x.classList.toggle("on",x===b));toast(b.dataset.s==="rag"?"Status shown: the owner’s RAG":b.dataset.s==="data"?"Status shown: calculated from the data":"Status shown: where the RAG and the data disagree")});$("#bMore").onclick=e=>morePanel(e.currentTarget);

 $("#q").oninput=e=>{S.q=e.target.value;if(S.tab!=="epics"&&S.q){S.tab="epics";$$("[data-tab]").forEach(x=>x.classList.toggle("on",x.dataset.tab==="epics"))}paint(true)};

function sync(){const set=(id,l,v,ic_)=>{const b=$(id);b.classList.toggle("on",!!v);b.innerHTML=`${l}${v?": "+v:""}<svg class="cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>`};const mc=Object.values(S.more).reduce((n,x)=>n+x.size,0),mb=$("#mcnt");if(mb){mb.style.display=mc?"inline-block":"none";mb.textContent=mc;$("#bMore").classList.toggle("on",mc>0)}set("#bStatus","Status",S.fs&&ST[S.fs].n);set("#bStage","Stage",S.fst);set("#bType","Type",S.ft);$$("[data-tab]").forEach(x=>x.classList.toggle("on",x.dataset.tab===S.tab))}
