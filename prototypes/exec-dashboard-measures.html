<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Executive Dashboard – more measures, every field mapped (prototype)</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--fg:#0f172a;--fg2:#64748b;--line:#e4e8f1;--ac:#7a1a3c;--ac2:#a8325c;--soft:#f8fafc;--g:#1fae5a;--a:#d97706;--r:#dc2626;--i:#64748b;--d:#166534;--sh:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 "Segoe UI",system-ui,sans-serif}
button,select,input{font:inherit}.btn{height:32px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;color:var(--fg)}.btn:hover{border-color:var(--ac)}.btn.pri{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;border:0}
.top{display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;display:grid;place-items:center;font-weight:700}.top b{font-size:16px}.top small{display:block;color:var(--fg2)}
.seg{display:inline-flex;padding:3px;background:#fff;border-radius:13px;box-shadow:var(--sh);border:1px solid var(--line)}.seg button{border:0;background:none;padding:7px 18px;border-radius:10px;color:var(--fg2);font-weight:600;cursor:pointer}.seg button.on{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff}
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:99px;background:#fbeff3;color:#6b1634;font-weight:600;font-size:12px}
.wrap{padding:0 20px 40px;max-width:1440px;margin:0 auto}h2.sec{margin:22px 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}h2.sec span{font-weight:400;color:var(--fg2);font-size:12px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.3fr 1fr}
.card{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--sh);position:relative}.card h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;gap:8px}.card h4 span{font-weight:400;color:var(--fg2);font-size:12px}
.kpi .v{font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1.1}.kpi .l{color:var(--fg2);display:flex;gap:6px;align-items:center}.kpi .d{color:var(--fg2);margin-top:4px;font-size:12px}.up{color:#166534}.down{color:#b91c1c}
.unm{display:grid;place-items:center;text-align:center;color:var(--fg2);min-height:92px;border:1.5px dashed #cbd5e1;border-radius:12px;padding:10px;background:var(--soft)}.unm b{color:var(--fg)}.unm a{color:var(--ac);cursor:pointer;text-decoration:underline}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#eef1f7}.bar i{display:block}
.row{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;margin:8px 0}.row small{color:var(--fg2)}
table{border-collapse:collapse;width:100%}th{text-align:left;color:var(--fg2);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}td{padding:6px 8px;border-bottom:1px solid #eef1f7}td.r,th.r{text-align:right}.pill{display:inline-flex;gap:5px;align-items:center;padding:1px 9px;border-radius:99px;font-weight:600;font-size:12px}
.chk{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #eef1f7}.chk i{width:12px;height:12px;border-radius:50%}.chk button{border:0;background:none;color:var(--ac);cursor:pointer;font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--fg2);font-size:11.5px;margin-top:8px}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
svg text{font:11px "Segoe UI",system-ui,sans-serif;fill:var(--fg2)}svg .t{font-weight:700;fill:var(--fg)}
/* mapping page */
.map{max-width:1080px}.map .card{margin-bottom:14px}.mt{width:100%}.mt th{font-size:12px}.mt select{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 6px;background:#fff}.mt td{vertical-align:middle}.ok{color:#166534;font-weight:600}.warn{color:#b45309;font-weight:600}.prev{font-family:Consolas,monospace;font-size:12px;color:var(--fg2)}
.grp{background:#f1f4fa;font-weight:700;color:#334155}.help{color:var(--fg2);margin:4px 0 10px}.th2{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}.th2 label{display:flex;gap:6px;align-items:center}.th2 input[type=number]{width:70px;height:30px;border:1px solid var(--line);border-radius:8px;padding:0 6px}
.note{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:8px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:20}.note.on{opacity:1}
</style></head><body>
<div class="top"><div class="logo">E</div><div><b>Executive Dashboard</b><small>Prototype · extra measures, each fed by a field you map</small></div><span style="flex:1"></span>
 <div class="seg" id="tabs"><button data-t="dash" class="on">Dashboard</button><button data-t="map">Settings › Field mapping</button></div></div>
<div class="wrap" id="dash"></div><div class="wrap map" id="map" style="display:none"></div><div class="note" id="note"></div>
<script>
const $=s=>document.querySelector(s);const C={g:"#1fae5a",a:"#d97706",r:"#dc2626",i:"#64748b",d:"#166534"};
// ---------- the Epic fields of the process (what the pickers would list) ----------
const FIELDS=[["Custom.Budget","Budget (£)","number"],["Custom.ForecastCost","Forecast cost (£)","number"],["Custom.ActualCost","Actual cost (£)","number"],["Custom.BusinessValue","Business value (£)","number"],["Custom.BenefitScore","Benefit score","number"],["Custom.OpenRisks","Open risks","number"],["Custom.HighRisks","High risks","number"],["Custom.OpenIssues","Open issues","number"],["Custom.Blocked","Blocked","choice"],["Custom.BlockerReason","Blocker reason","text"],["Microsoft.VSTS.Common.ClosedDate","Closed date","date"],["Custom.CompletedOn","Completed on","date"],["Custom.RAGUpdated","RAG last updated","date"],["Custom.Sponsor","Executive sponsor","identity"],["System.AssignedTo","Assigned to","identity"],["Custom.StrategicTheme","Strategic theme","choice"],["Custom.DependsOn","Dependency count","number"]];
// ---------- what can be mapped ----------
const MEASURES=[
 ["Value and cost",[["budget","Budget","number","Budget, variance"],["forecast","Forecast cost","number","Budget variance"],["actual","Actual cost","number","Spend to date"],["value","Business value","number","Value at risk"]]],
 ["Delivery",[["done","Completed date","date","On-time rate, time to done","history"],["ragdate","RAG last updated","date","Stale RAG","history"]]],
 ["Risks and blockers",[["risks","Open risks","number","Risks per Epic"],["highrisks","High risks","number","High-risk Epics"],["blocked","Blocked flag","choice","Blocked Epics"],["reason","Blocker reason","text","Blocked list"],["deps","Dependency count","number","Dependencies"]]],
 ["People and grouping",[["sponsor","Executive sponsor","identity","Owner column, completeness"],["theme","Strategic theme","choice","Value by theme"]]]];
const MAP={budget:"Custom.Budget",forecast:"Custom.ForecastCost",actual:"",value:"Custom.BusinessValue",done:"Microsoft.VSTS.Common.ClosedDate",ragdate:"history",risks:"Custom.OpenRisks",highrisks:"Custom.HighRisks",blocked:"Custom.Blocked",reason:"Custom.BlockerReason",deps:"",sponsor:"Custom.Sponsor",theme:"Custom.StrategicTheme"};
let STALE=30;
// ---------- sample Epics ----------
let s=11;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
const TH=["Regulatory","Growth","Efficiency","Resilience","Customer"],OWN=["Ana R.","Ben K.","Chen L.","Dara M.","Eli S.","Fay T."];
const NAMES=["Core banking upgrade","Mobile app launch","Payments gateway","Data lake migration","Credit scoring","KYC automation","Branch queue system","Cloud landing zone","Loyalty revamp","Basel IV reporting","AML monitoring","Digital onboarding","SOC automation","Zero trust rollout","Chatbot v2","Reporting warehouse","ERP v12 upgrade","FATCA update","Treasury platform","Card tokenisation","Self-service portal","Network refresh","DR failover test","Windows 11 rollout","Open banking APIs","Fraud engine","Customer 360","Collections redesign","Data governance","Liquidity reporting"];
const TODAY=new Date("2026-10-28"),DAY=864e5,iso=d=>new Date(d).toISOString().slice(0,10);
const EP=NAMES.map((n,i)=>{const st=["g","g","g","a","a","r","r","i","d","d"][Math.floor(rnd()*10)],goLive=new Date(+TODAY+(Math.floor(rnd()*300)-60)*DAY),bud=Math.round((200+rnd()*1800)/10)*10*1000,over=st==="r"?1.1+rnd()*.35:st==="a"?1.02+rnd()*.12:.92+rnd()*.1;
 const f={"Custom.Budget":bud,"Custom.ForecastCost":Math.round(bud*over/1000)*1000,"Custom.ActualCost":Math.round(bud*over*(st==="d"?1:.3+rnd()*.5)/1000)*1000,"Custom.BusinessValue":Math.round((bud*(1.5+rnd()*3))/1000)*1000,"Custom.BenefitScore":Math.round(rnd()*10),"Custom.OpenRisks":st==="d"?0:Math.floor(rnd()*6),"Custom.HighRisks":st==="r"?1+Math.floor(rnd()*3):Math.floor(rnd()*2),"Custom.OpenIssues":Math.floor(rnd()*4),
  "Custom.Blocked":(st==="r"&&rnd()<.6)||(st==="a"&&rnd()<.2)?"Yes":"No","Custom.BlockerReason":["Vendor contract not signed","Waiting for regulator feedback","Environment not ready","Key person left","Scope under review"][Math.floor(rnd()*5)],
  "Microsoft.VSTS.Common.ClosedDate":st==="d"?iso(+goLive+(Math.floor(rnd()*30)-18)*DAY):"","Custom.CompletedOn":"","Custom.RAGUpdated":iso(+TODAY-Math.floor(rnd()*(st==="r"?70:40))*DAY),"Custom.Sponsor":rnd()<.12?"":OWN[Math.floor(rnd()*6)],"System.AssignedTo":OWN[Math.floor(rnd()*6)],"Custom.StrategicTheme":TH[Math.floor(rnd()*5)],"Custom.DependsOn":Math.floor(rnd()*4)};
 return {id:1100+i*7,t:n,st,goLive:iso(goLive),f,hasProg:rnd()>.12,hasDate:rnd()>.06,moves:Math.floor(rnd()*4),ragAge:0};});
EP.forEach(e=>{e.ragAge=Math.round((TODAY-new Date(e.f["Custom.RAGUpdated"]))/DAY);});
// ---------- helpers ----------
const val=(e,k)=>{const f=MAP[k];if(!f)return undefined;if(f==="history"){if(k==="ragdate")return e.f["Custom.RAGUpdated"];if(k==="done")return e.st==="d"?e.f["Microsoft.VSTS.Common.ClosedDate"]:"";}const v=e.f[f];return v;};
const mapped=k=>!!MAP[k],num=(e,k)=>+val(e,k)||0,sum=(a,k)=>a.reduce((x,e)=>x+num(e,k),0);
const money=n=>(n<0?"-":"")+"£"+(Math.abs(n)>=1e6?(Math.abs(n)/1e6).toFixed(1)+"m":Math.round(Math.abs(n)/1e3)+"k");
const un=(label,why)=>`<div class="unm"><div><b>${label}</b><br>Not mapped yet. ${why}<br><a data-go="map">Map a field in Settings</a></div></div>`;
const card=(h,sub,body,cls="")=>`<div class="card ${cls}"><h4>${h}<span>${sub||""}</span></h4>${body}</div>`;
const kpi=(label,v,d,cls="")=>`<div class="card kpi"><div class="l">${label}</div><div class="v">${v}</div><div class="d ${cls}">${d}</div></div>`;
const need=(keys,label,why,fn)=>keys.every(mapped)?fn():card(label,"",un(label,why));
// ---------- the dashboard ----------
function dash(){const ep=EP,act=ep.filter(e=>e.st!=="d"&&e.st!=="i"),red=ep.filter(e=>e.st==="r"),done=ep.filter(e=>e.st==="d");let h="";
 h+=`<h2 class="sec">Portfolio health <span>already on the dashboard: status split, owner RAG against data, weekly trend</span></h2><div class="grid g4">
  ${kpi("Portfolio health",Math.round(100*ep.filter(e=>e.st==="g"||e.st==="d").length/Math.max(1,ep.filter(e=>e.st!=="i").length))+"%","▲ +3 vs last week","up")}${kpi("At risk",red.length,"▲ +1 vs last week","down")}${kpi("Needs attention",ep.filter(e=>e.st==="a").length,"no change vs last week")}${kpi("Done",done.length,"▲ +2 vs last week","up")}</div>`;
 // value and cost
 h+=`<h2 class="sec">Value and cost <span>fields: budget, forecast cost, actual cost, business value</span></h2><div class="grid g4">`;
 h+=need(["budget","forecast"],"Budget variance","Needs Budget and Forecast cost.",()=>{const b=sum(act,"budget"),f=sum(act,"forecast"),v=f-b;return kpi("Budget variance",(v>0?"+":"")+Math.round(100*v/b*10)/10+"%",`${money(f)} forecast against ${money(b)} budget`,v>0?"down":"up");});
 h+=need(["actual","budget"],"Spend to date","Needs Actual cost and Budget.",()=>kpi("Spend to date",money(sum(act,"actual")),`${Math.round(100*sum(act,"actual")/sum(act,"budget"))}% of the budget`));
 h+=need(["value"],"Value at risk","Needs Business value.",()=>{const v=sum(red,"value"),t=sum(ep,"value");return kpi("Value at risk",money(v),`${Math.round(100*v/t)}% of ${money(t)} total value (Epics that are At risk)`,"down");});
 h+=need(["value","budget"],"Value for money","Needs Business value and Budget.",()=>kpi("Value for money",(sum(act,"value")/sum(act,"budget")).toFixed(1)+"×","business value per £ of budget"));
 h+=`</div><div class="grid g2" style="margin-top:14px">`;
 h+=need(["budget","forecast","theme"],"Budget against forecast by theme","Needs Budget, Forecast cost and Strategic theme.",()=>{const rows=TH.map(t=>{const a=act.filter(e=>val(e,"theme")===t);return {t,b:sum(a,"budget"),f:sum(a,"forecast"),a:mapped("actual")?sum(a,"actual"):0};});const mx=Math.max(...rows.map(r=>Math.max(r.b,r.f)));
   return card("Budget against forecast by theme",mapped("actual")?"budget · forecast · spent":"budget · forecast",rows.map(r=>`<div class="row"><span>${r.t}</span><div><div class="bar" style="margin-bottom:3px"><i style="width:${r.b/mx*100}%;background:#94a3b8"></i></div><div class="bar"><i style="width:${r.f/mx*100}%;background:${r.f>r.b?C.r:C.g}"></i></div></div><small>${(r.f>r.b?"+":"")+Math.round(100*(r.f-r.b)/r.b)}%</small></div>`).join("")+`<div class="legend"><span><i style="background:#94a3b8"></i>Budget</span><span><i style="background:${C.g}"></i>Forecast within budget</span><span><i style="background:${C.r}"></i>Forecast over budget</span></div>`);});
 h+=need(["budget","forecast"],"Biggest forecast overruns","Needs Budget and Forecast cost.",()=>card("Biggest forecast overruns","£ over budget",`<table>${[...act].map(e=>({e,o:num(e,"forecast")-num(e,"budget")})).sort((a,b)=>b.o-a.o).slice(0,5).map(x=>`<tr><td>${x.e.t}</td><td class="r down">${money(x.o)}</td></tr>`).join("")}</table>`));
 h+=`</div>`;
 // delivery performance
 h+=`<h2 class="sec">Delivery performance <span>fields: completed date (or read from the work item history), go-live date</span></h2><div class="grid g4">`;
 const dd=done.filter(e=>val(e,"done"));
 h+=need(["done"],"On-time delivery rate","Needs a Completed date field, or choose “from history”.",()=>{const on=dd.filter(e=>val(e,"done")<=e.goLive).length;return kpi("On-time delivery rate",Math.round(100*on/Math.max(1,dd.length))+"%",`${on} of ${dd.length} finished Epics delivered on or before go-live`,on/Math.max(1,dd.length)>.7?"up":"down");});
 h+=need(["done"],"Average days late","Needs a Completed date.",()=>{const l=dd.map(e=>Math.round((new Date(val(e,"done"))-new Date(e.goLive))/DAY)).filter(x=>x>0);return kpi("Average days late",l.length?Math.round(l.reduce((a,b)=>a+b,0)/l.length)+" d":"0 d","for finished Epics that were late");});
 h+=kpi("Go-live dates moved",ep.reduce((a,e)=>a+e.moves,0),"in the last 90 days (already on the dashboard)");
 h+=kpi("Due in the next 30 days",ep.filter(e=>e.st!=="d"&&new Date(e.goLive)>=TODAY&&new Date(e.goLive)<=new Date(+TODAY+30*DAY)).length,"not yet done");
 h+=`</div>`;
 // risks and blockers
 h+=`<h2 class="sec">Risks and blockers <span>fields: open risks, high risks, blocked flag and reason, dependencies</span></h2><div class="grid g3">`;
 h+=need(["risks","highrisks"],"Open risks","Needs Open risks and High risks.",()=>{const hr=act.filter(e=>num(e,"highrisks")>0);return card("Open risks",`${sum(act,"risks")} open · ${sum(act,"highrisks")} high`,`<div class="bar" style="height:20px;margin:8px 0"><i style="width:${sum(act,"highrisks")/Math.max(1,sum(act,"risks"))*100}%;background:${C.r}"></i><i style="flex:1;background:${C.a}"></i></div><div class="legend"><span><i style="background:${C.r}"></i>High</span><span><i style="background:${C.a}"></i>Other</span></div><div class="d" style="margin-top:10px"><b>${hr.length}</b> Epics carry at least one high risk, <b>${hr.filter(e=>e.st==="g").length}</b> of them still shown On track.</div>`);});
 h+=need(["blocked","reason"],"Blocked Epics","Needs the Blocked flag and Blocker reason.",()=>{const bl=act.filter(e=>val(e,"blocked")==="Yes");return card("Blocked Epics",bl.length+" now",`<table>${bl.slice(0,5).map(e=>`<tr><td>${e.t}<div style="color:var(--fg2);font-size:12px">${val(e,"reason")}</div></td></tr>`).join("")||"<tr><td>None blocked.</td></tr>"}</table>`);});
 h+=need(["deps"],"Dependencies","Needs a Dependency count (or a link type).",()=>card("Epics with the most dependencies","count",`<table>${[...act].sort((a,b)=>num(b,"deps")-num(a,"deps")).slice(0,5).map(e=>`<tr><td>${e.t}</td><td class="r">${num(e,"deps")}</td></tr>`).join("")}</table>`));
 h+=`</div>`;
 // governance
 const checks=[["No go-live date",e=>!e.hasDate,true],["No progress value",e=>!e.hasProg,true],["No executive sponsor",e=>mapped("sponsor")&&!val(e,"sponsor"),mapped("sponsor")],[`RAG not updated for ${STALE}+ days`,e=>mapped("ragdate")&&(Math.round((TODAY-new Date(val(e,"ragdate")))/DAY)>=STALE),mapped("ragdate")]].filter(c=>c[2]);
 const bad=new Set();checks.forEach(c=>act.forEach(e=>{if(c[1](e))bad.add(e.id);}));const score=Math.round(100*(1-bad.size/Math.max(1,act.length)));
 h+=`<h2 class="sec">Governance and data quality <span>fields: sponsor, RAG last updated (or read from history)</span></h2><div class="grid g2">`+card("Data completeness",score+"% of Epics fully filled in",`<div style="display:flex;gap:18px;align-items:center"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="38" fill="none" stroke="#eef1f7" stroke-width="12"/><circle cx="48" cy="48" r="38" fill="none" stroke="${score>80?C.g:score>60?C.a:C.r}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${2*Math.PI*38*score/100} 999" transform="rotate(-90 48 48)"/><text x="48" y="53" text-anchor="middle" class="t" style="font-size:20px">${score}%</text></svg><div style="flex:1">${checks.map(c=>{const n=act.filter(c[1]).length;return `<div class="chk"><i style="background:${n?C.a:C.g}"></i><span>${c[0]}</span><b>${n}</b></div>`;}).join("")}</div></div>`);
 h+=card("Value by strategic theme","£ of business value, split by status",mapped("value")&&mapped("theme")?TH.map(t=>{const a=ep.filter(e=>val(e,"theme")===t),tot=Math.max(1,sum(a,"value"));return `<div class="row"><span>${t}</span><div class="bar">${["g","a","r","i","d"].map(k=>{const v=sum(a.filter(e=>e.st===k),"value");return v?`<i style="width:${v/tot*100}%;background:${C[k]}"></i>`:"";}).join("")}</div><small>${money(tot)}</small></div>`;}).join(""):un("Value by theme","Needs Business value and Strategic theme."))+`</div>`;
 $("#dash").innerHTML=h;$("#dash").querySelectorAll("[data-go]").forEach(a=>a.onclick=()=>tab("map"));}
// ---------- mapping page ----------
function mapping(){let h=`<div class="card"><h2 style="margin:0 0 4px;font-size:17px">Field mapping</h2><div class="help">Every extra measure reads a field you choose here. A tile whose field is not mapped is replaced by a note, so nothing is guessed. Fields are listed by their display names; only fields of a fitting type are offered, and you can also type a reference name.</div>
 <table class="mt"><tr><th style="width:21%">Measure</th><th style="width:11%">Type needed</th><th style="width:30%">Epic field</th><th>Used for</th><th style="width:17%">Sample</th><th style="width:7%"></th></tr>`;
 for(const [g,items] of MEASURES){h+=`<tr class="grp"><td colspan="6">${g}</td></tr>`;for(const [k,label,type,use,hist] of items){const ok=FIELDS.filter(f=>f[2]===type||(type==="text"&&f[2]!=="number")||(type==="choice"&&f[2]==="choice"));
  h+=`<tr><td><b>${label}</b></td><td>${type}</td><td><select data-k="${k}"><option value="">(not mapped)</option>${hist?`<option value="history"${MAP[k]==="history"?" selected":""}>Read from the work item history</option>`:""}${ok.map(f=>`<option value="${f[0]}"${MAP[k]===f[0]?" selected":""}>${f[1]} · ${f[0]}</option>`).join("")}</select></td><td>${use}</td><td class="prev">${MAP[k]?String(val(EP[0],k)??"–").slice(0,22)||"–":""}</td><td>${MAP[k]?'<span class="ok">✓</span>':'<span class="warn">○</span>'}</td></tr>`;}}
 h+=`</table></div><div class="card"><h3 style="margin:0 0 4px;font-size:14px">Thresholds</h3><div class="th2"><label>RAG counts as stale after <input type="number" id="stale" value="${STALE}"> days without an update</label><label>Show a “high risk but On track” warning <input type="checkbox" checked></label></div></div>
 <div class="card"><h3 style="margin:0 0 4px;font-size:14px">How the measures use the fields</h3><div class="help" style="margin:0">Budget variance = forecast cost minus budget, for Epics not done. Value at risk = business value of Epics that are At risk. On-time delivery rate = finished Epics whose completed date is on or before the go-live date. Data completeness = share of Epics in progress with a go-live date, a progress value, a sponsor and a recent RAG.</div></div>`;
 $("#map").innerHTML=h;$("#map").querySelectorAll("select[data-k]").forEach(s=>s.onchange=()=>{MAP[s.dataset.k]=s.value;mapping();say("Mapping saved · the dashboard tiles update");});$("#stale").onchange=e=>{STALE=+e.target.value||30;say("Threshold saved");};}
function tab(t){document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));$("#dash").style.display=t==="dash"?"block":"none";$("#map").style.display=t==="map"?"block":"none";if(t==="dash")dash();else mapping();}
function say(t){const n=$("#note");n.textContent=t;n.classList.add("on");clearTimeout(say.t);say.t=setTimeout(()=>n.classList.remove("on"),1800);}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>tab(b.dataset.t));dash();
</script></body></html>
